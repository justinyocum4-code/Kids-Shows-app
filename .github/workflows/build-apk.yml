name: Build Kids Shows APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0)'
        required: true
        default: '4.0'
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Verify index.html exists
        run: |
          test -f ./index.html || (echo "ERROR: index.html not found in repo root" && exit 1)
          grep -q 'id="kids-shows-app"' ./index.html || (echo "ERROR: guard id kids-shows-app not found" && exit 1)
          grep -q 'LIVESTREAMS' ./index.html || (echo "ERROR: LIVESTREAMS data missing" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/kidsshows/app app/src/main/res/values
          cp ./index.html app/src/main/assets_index.html 2>/dev/null || true
          mkdir -p app/src/main/assets
          cp ./index.html app/src/main/assets/index.html
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
            <uses-feature android:name="android.software.leanback" android:required="false"/>
            <application android:label="Kids Shows" android:theme="@android:style/Theme.Black.NoTitleBar" android:banner="@android:drawable/sym_def_app_icon" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/kidsshows/app/MainActivity.java <<'EOF'
          package com.kidsshows.app;
          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView w;
            @Override protected void onCreate(Bundle s) {
              super.onCreate(s);
              w = new WebView(this);
              WebSettings st = w.getSettings();
              st.setJavaScriptEnabled(true);
              st.setDomStorageEnabled(true);
              st.setLoadWithOverviewMode(true);
              st.setUseWideViewPort(true);
              st.setMediaPlaybackRequiresUserGesture(false);
              // Allow the local page to fetch https content (matches other Lynxos apps).
              st.setAllowFileAccessFromFileURLs(true);
              st.setAllowUniversalAccessFromFileURLs(true);
              // Cookies help embedded players (YouTube) work without extra sign-ins.
              CookieManager cm = CookieManager.getInstance();
              cm.setAcceptCookie(true);
              if (Build.VERSION.SDK_INT >= 21) cm.setAcceptThirdPartyCookies(w, true);
              // Keep every navigation inside the app. Nothing opens a browser.
              w.setWebViewClient(new WebViewClient());
              setContentView(w);
              w.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed() {
              if (w != null && w.canGoBack()) { w.goBack(); return; }
              super.onBackPressed();
            }
          }
          EOF
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.kidsshows.app'
            compileSdk 34
            defaultConfig {
              applicationId 'com.kidsshows.app'
              minSdk 24
              targetSdk 34
              versionCode ${{ inputs.version_code }}
              versionName '${{ inputs.version_name }}'
            }
            signingConfigs {
              release {
                storeFile file(System.getenv('KEYSTORE_PATH') ?: 'lynxos-release.keystore')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
              }
            }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          EOF
          cat > settings.gradle <<'EOF'
          rootProject.name = 'KidsShows'
          include ':app'
          EOF

      - name: Restore Lynxos signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > lynxos-release.keystore
          echo "KEYSTORE_PATH=$PWD/lynxos-release.keystore" >> $GITHUB_ENV

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          gradle :app:assembleRelease --no-daemon -q || ./gradlew :app:assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
